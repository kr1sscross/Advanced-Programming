
name: Python CI

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install flake8
        run: python -m pip install flake8

      - name: Check syntax and indentation
        run: flake8 --select=E999,E117 .
